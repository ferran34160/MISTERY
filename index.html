<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2118">
<title>El crim del mas</title>
<style>
:root{
  --bg:#f4ecdf;--panel:#fffaf1;--ink:#2b2118;--muted:#7a6a58;--line:#2b2118;--accent:#b5472f;--ok:#3c7a4a;--bad:#c0392b;
  --hole:transparent;--cellgrid:rgba(43,33,24,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#1d1813;--panel:#2a231b;--ink:#f1e6d3;--muted:#a89a85;--line:#f1e6d3;--accent:#e0795f;--ok:#6fbf82;--bad:#ff7a69;--cellgrid:rgba(241,230,211,.2)}
}
:root[data-theme=dark]{--bg:#1d1813;--panel:#2a231b;--ink:#f1e6d3;--muted:#a89a85;--line:#f1e6d3;--accent:#e0795f;--ok:#6fbf82;--bad:#ff7a69;--cellgrid:rgba(241,230,211,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background-image:radial-gradient(circle at 15% 0,#ffffff55,transparent 45%),repeating-linear-gradient(45deg,#0000000a 0 2px,transparent 2px 7px);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:520px;margin:0 auto}
header h1{font-size:1.05rem;margin:0;flex:1;line-height:1.15}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.ib{padding:6px 10px;min-width:40px}
main{max-width:520px;margin:0 auto;padding:0 12px 24px}
.hidden{display:none!important}

/* llista de casos */
.list{display:grid;gap:10px}
.case{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;width:100%}
.case .num{font-size:1.4rem;font-weight:800;width:2.2rem;text-align:center}
.case .meta{flex:1}
.case .meta b{display:block}
.case .meta span{color:var(--muted);font-size:.85rem}
.stamp{color:var(--ok);font-weight:800;border:2px solid var(--ok);border-radius:8px;padding:2px 6px;transform:rotate(-6deg);font-size:.8rem}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--cellgrid)}
.lvl i.on{background:var(--accent)}


/* llista estil col·lecció */
.hero{max-width:520px;margin:0 auto;padding:14px 12px 4px}
.hero .top{display:flex;align-items:center;gap:8px}
.logoimg{flex:1;min-width:0;max-width:190px;width:100%;height:auto;object-fit:contain}
.logo{flex:1;font-weight:900;font-size:1.7rem;letter-spacing:.14em;line-height:1}
.logo b{color:var(--accent)}.logo small{display:block;font-size:.62rem;letter-spacing:.12em;font-weight:600;color:var(--muted);margin-top:3px}
.hero select{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 8px}
.alfa{display:flex;gap:10px;align-items:center;margin:12px 0 6px;font-size:.8rem;color:var(--muted)}
.alfa i{font-style:normal;font-weight:800;color:var(--ok);border:2px solid var(--ok);border-radius:6px;padding:3px 6px;font-size:.7rem;letter-spacing:.08em}
.sum{text-align:center;font-size:.95rem;margin:6px 0 10px}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;padding:6px 11px;font-size:.85rem;border-radius:9px;box-shadow:0 2px 0 var(--line)}
.tabs2 button.on{background:var(--accent);color:#fff;border-color:var(--line)}
.sortrow{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin:2px 0 10px}
.sortrow select{flex:1}.sortrow button{padding:7px 10px;font-size:.8rem}
#home.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding-top:12px}
.pc{position:relative;border:12px solid transparent;border-image:url("paper.png") 60 fill/12px stretch;background:none;padding:20px 0 6px;text-align:center;cursor:pointer;display:block;width:100%;font:inherit;color:inherit;transition:transform .15s;filter:drop-shadow(0 4px 4px rgba(43,33,24,.35))}
#home.grid .pc:nth-child(odd){transform:rotate(-.7deg)}#home.grid .pc:nth-child(even){transform:rotate(.6deg)}
.pc:active{transform:scale(.98)!important}
.pc:before{content:"";position:absolute;top:-24px;left:50%;margin-left:-12px;width:24px;height:31px;background:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2031%27%3E%3Cellipse%20cx=%2713%27%20cy=%2727.5%27%20rx=%275%27%20ry=%271.6%27%20fill=%27rgba%280%2C0%2C0%2C.28%29%27/%3E%3Cpath%20d=%27M12%2014v14%27%20stroke=%27%238a8f98%27%20stroke-width=%271.8%27%20stroke-linecap=%27round%27/%3E%3Ccircle%20cx=%2712%27%20cy=%279%27%20r=%278%27%20fill=%27%23c9a24a%27/%3E%3Ccircle%20cx=%2712%27%20cy=%279%27%20r=%278%27%20fill=%27none%27%20stroke=%27%236b4e16%27%20stroke-width=%271.2%27/%3E%3Ccircle%20cx=%2712%27%20cy=%279%27%20r=%274.2%27%20fill=%27%23e6c875%27/%3E%3Ccircle%20cx=%279.4%27%20cy=%276.4%27%20r=%272.3%27%20fill=%27%23fff%27%20opacity=%27.6%27/%3E%3C/svg%3E") center/contain no-repeat;z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.pc.done{filter:drop-shadow(0 4px 4px rgba(43,33,24,.35)) saturate(.92)}
.pc .nm{display:block;font-weight:800;font-size:.95rem;margin:10px 0 6px;line-height:1.15;letter-spacing:.01em}
.pill{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 9px;border-radius:6px;border:1.5px solid currentColor}
.l1{color:#2f8a4e;background:#2f8a4e1f}.l2{color:#4d8f2a;background:#4d8f2a1f}.l3{color:#b57a14;background:#b57a141f}.l4{color:#c0502a;background:#c0502a1f}.l5{color:#8b3fa8;background:#8b3fa81f}
.pc .sz{display:block;font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:700}
.pc .tag{display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sc,var(--muted));margin-top:5px;font-weight:800}
.th{display:block;width:88%;margin:0 auto;aspect-ratio:1;position:relative;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.th svg{width:100%;height:100%;display:block}
.pc.done .th svg{filter:saturate(.8)}
.pc .seal{position:absolute;left:-4%;right:-4%;top:34%;transform:rotate(-16deg);border:3px double var(--ok);border-radius:8px;color:var(--ok);background:color-mix(in srgb,var(--panel) 62%,transparent);font-weight:900;letter-spacing:.1em;font-size:1.05rem;line-height:1.05;padding:5px 2px;text-transform:uppercase;box-shadow:0 0 0 2px #fff6;mix-blend-mode:normal}
.pc .chk{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:.85rem;line-height:24px;font-weight:800;z-index:4;box-shadow:0 2px 3px #0004}
.pc.prog .chk{background:var(--accent)}
/* sobre */
.pc.env .env{display:block;position:relative;width:96%;margin:0 auto;aspect-ratio:389/404}
.env .eimg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(43,33,24,.3))}
.env .paper{display:block;position:absolute;left:9%;top:20%;width:79%;height:42%;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 38%,52% 100%,0 38%);background:var(--bg)}
.env .paper svg{width:100%;display:block}
.env .rev{position:absolute;left:10%;right:10%;top:65%;transform:rotate(-3deg);z-index:4;text-align:center;color:#4a3320;text-shadow:0 1px 0 rgba(255,244,214,.8);pointer-events:none}
.env .rev b{display:block;font-weight:900;font-size:clamp(.72rem,3.6vw,.92rem);letter-spacing:.06em;line-height:1.05}
.env .rev i{display:block;font-style:normal;font-weight:800;font-size:clamp(.46rem,2.2vw,.58rem);letter-spacing:.07em;margin-top:3px;opacity:.9}
.pc.env.open .env{animation:shake .38s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.03)}60%{transform:rotate(2.5deg) scale(1.04)}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
.nws{display:none}


/* terres de les sales (imatges a terres/; el color de la sala hi queda barrejat) */
.cell[class*="tx-"]{background-size:100% 100%;background-blend-mode:multiply}
.tx-wood{background-image:url("terres/parquet.jpg")}
.tx-tiles{background-image:url("terres/rajoles.jpg")}
.tx-grass{background-image:url("terres/gespa.jpg")}
.tx-stone{background-image:url("terres/pedra.jpg")}
.tx-carpet{background-image:url("terres/moqueta.jpg")}
.tx-water{background-image:url("terres/aigua.jpg")}
.tx-sand{background-image:url("terres/sorra.jpg")}
.tx-metal{background-image:url("terres/metall.jpg")}
.tx-pavers{background-image:url("terres/llambordes.jpg")}

/* tauler */
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;padding:2px 2px 8px}
#board{display:grid;gap:0;width:100%;aspect-ratio:1;border-radius:6px;touch-action:none}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border:0 solid var(--line);outline:1px solid var(--cellgrid);outline-offset:-1px}
.cell.hole{background:var(--hole);outline:none}
.cell.blocked::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.08) 6px 7px);pointer-events:none}
.cell.line{box-shadow:inset 0 0 0 100px rgba(43,33,24,.13)}
.cell .rn{position:absolute;left:3px;top:1px;font-size:clamp(7px,2.2vw,10px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75;pointer-events:none;white-space:normal;right:2px;line-height:1.05;z-index:4;text-shadow:0 0 3px rgba(255,255,255,.85),0 0 2px rgba(255,255,255,.85)}
.cell svg.obj,.cell img.obj{position:absolute;inset:8%;width:84%;height:84%;pointer-events:none}.cell img.obj{object-fit:contain;object-position:center;inset:3%;width:94%;height:94%}
.cell.free svg.obj{inset:auto 1px 1px auto;width:56%;height:56%}
.cell.placed svg.obj,.cell.placed img.obj{opacity:.3}
.mark.auto{color:var(--ink);opacity:.62;font-weight:700}
.mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,7vw,32px);font-weight:700;color:var(--bad);pointer-events:none}
.notes{position:absolute;inset:0;padding:2px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:0 2px;font-size:clamp(8px,2.6vw,12px);font-weight:700;color:var(--muted);line-height:1.1;pointer-events:none}
.tok{position:relative;width:78%;height:78%;border-radius:50%;font-weight:800;font-size:clamp(14px,5vw,24px);border:2px solid var(--line);pointer-events:none;z-index:2}.tok svg,.tok img.ph{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}.cell .tok{position:absolute;left:11%;top:11%;width:78%;height:78%}.tok .lt{position:absolute;right:-5px;bottom:-5px;min-width:1.15em;height:1.15em;line-height:1.15em;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.55em;text-align:center;border:1.5px solid var(--bg)}
.cell.bad{outline:3px solid var(--bad);outline-offset:-3px}

/* eines */
.lgd{margin:10px 0 0;border:1.5px solid var(--cellgrid);border-radius:12px;background:var(--panel);padding:2px 10px}.lgd summary{cursor:pointer;font-weight:700;font-size:.88rem;padding:7px 0;list-style:none}.lgd summary::-webkit-details-marker{display:none}.lgd summary:before{content:"▸ ";color:var(--muted)}.lgd[open] summary:before{content:"▾ "}.lgd summary em{font-style:normal;color:var(--muted);font-weight:400}.lgd .legend{margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 0}.legend span{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1.5px solid var(--cellgrid);border-radius:20px;padding:2px 9px 2px 4px;font-size:.78rem}.legend svg,.legend img{width:28px;height:28px;object-fit:contain}.legend em{font-style:normal;color:var(--muted);font-size:.7rem}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.tools button{padding:8px 0;font-size:1.05rem}
.tools button.on{background:var(--ink);color:var(--bg)}
.tools button small{display:block;font-size:.62rem;opacity:.8}
#msg{min-height:1.4em;text-align:center;font-weight:600;margin:0 0 8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:8px;border-radius:12px;width:100%}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.card .tok{flex:none;width:46px;height:46px;font-size:1.3rem}
.card .tx b{display:block;font-size:.9rem}
.card .tx span{font-size:.8rem;color:var(--muted);line-height:1.25;display:block}
.card.done .tx span{text-decoration:line-through;opacity:.6}
.card .pl{margin-left:auto;color:var(--ok);font-weight:800}
h2{font-size:.95rem;margin:16px 0 6px}
.gen{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.gen li{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem}
.gen li.done{text-decoration:line-through;opacity:.6}


/* volum i animacions */
button{box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
button:active{box-shadow:0 0 0 var(--line)}
#board{filter:drop-shadow(0 5px 6px rgba(43,33,24,.35)) drop-shadow(0 1px 1px rgba(43,33,24,.4))}
.cell{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.07)}
.cell svg.obj,.cell img.obj{filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.38))}
.tok{box-shadow:0 3px 5px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.35)}
.tok.pop{animation:pop .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.2) translateY(-10px);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.card{box-shadow:0 2px 0 var(--line)}
.card.plc .tok{opacity:.5;filter:grayscale(.4);transition:opacity .2s}
.card.sel{animation:selp .25s ease-out}
@keyframes selp{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pc{animation:cin .45s both;animation-delay:calc(var(--d,0)*35ms)}
@keyframes cin{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.pc.slam .seal{animation:slam .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slam{0%{transform:rotate(-16deg) scale(3);opacity:0}60%{transform:rotate(-16deg) scale(.92);opacity:1}100%{transform:rotate(-16deg) scale(1);opacity:1}}
.win .stampw{display:inline-block;margin:6px auto 2px;border:4px double var(--ok);color:var(--ok);border-radius:10px;padding:4px 14px;font-weight:900;letter-spacing:.12em;font-size:1.25rem;transform:rotate(-7deg);animation:slamw .6s cubic-bezier(.2,1.4,.4,1) both .15s}
@keyframes slamw{0%{transform:rotate(-7deg) scale(3.2);opacity:0}60%{transform:rotate(-7deg) scale(.9);opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.win .culprit .tok{animation:pop .5s cubic-bezier(.3,1.7,.5,1) .35s both}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.tok.pop,.pc,.card.sel,.pc.slam .seal,.win .stampw,.win .culprit .tok{animation:none!important}.conf{display:none}}


/* classificació */
.rk table{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.rk th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px}
.rk td{padding:7px 6px;border-top:1px solid var(--cellgrid)}
.rk td.n{width:2rem;font-weight:800;text-align:center}
.rk td.r{text-align:right;font-variant-numeric:tabular-nums}
.rk tr.me td{background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.rk .nick{display:flex;gap:6px;margin:6px 0 4px}
.rk .nick input{flex:1;font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:0}
.rk select{font:inherit;width:100%;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.rk .nota{font-size:.82rem;color:var(--muted);margin:6px 0}
.rkw{margin:10px 0 0;font-size:.9rem}
.rkw b{color:var(--ok)}


/* pistes il·luminades i bombeta */
.cell.hl::after{content:"";position:absolute;inset:0;background:rgba(255,214,64,.40);box-shadow:inset 0 0 0 3px rgba(226,160,0,.95);pointer-events:none;z-index:3}
.cell.hint::after{content:"";position:absolute;inset:0;background:rgba(80,160,255,.28);box-shadow:inset 0 0 0 3px rgba(40,110,230,.95);pointer-events:none;z-index:3;animation:hp 1s ease-in-out infinite}
@keyframes hp{0%,100%{opacity:.55}50%{opacity:1}}
.tx span.hlc{background:rgba(255,214,64,.5);border-radius:4px;box-shadow:0 0 0 2px rgba(255,214,64,.5)}
.card.hintc{box-shadow:0 0 0 3px rgba(40,110,230,.9)}
@media (prefers-reduced-motion:reduce){.cell.hint::after{animation:none}}

/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:16px 16px 28px}
.sheet h3{margin:0 0 8px}
.sheet p,.sheet li{font-size:.92rem;line-height:1.4}
.sheet ul{padding-left:18px;margin:6px 0}
.sheet .close{float:right}
.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs button{flex:1;padding:6px 8px;font-size:.88rem}.tabs button.on{background:var(--ink);color:var(--bg)}
.kws{display:grid;gap:10px}.kw{display:flex;gap:12px;align-items:center}.kw svg{flex:none;width:84px;height:84px}.kw p{margin:0}
.kw .g{fill:var(--panel);stroke:var(--cellgrid)}.kw .h{fill:var(--cellgrid)}.kw .t{fill:var(--accent);fill-opacity:.35}.kw .w{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}.kw .a{fill:var(--accent)}.kw .q{fill:var(--ink)}.kw text{font:700 11px system-ui;fill:#fff;text-anchor:middle;dominant-baseline:central}
.win{text-align:center}
.win .big{font-size:2.6rem}
.win .culprit{display:flex;justify-content:center;margin:10px 0}
.win .culprit .tok{width:96px;height:96px;font-size:2.4rem}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <button class="ib hidden" id="back" aria-label="Enrere">←</button>
  <h1 id="title"></h1>
  <button class="ib" id="help">?</button>
  <button class="ib" id="lang">FR</button>
</header>
<main>
  <section id="hero" class="hero"></section>
  <section id="home" class="grid"><p id="boot" class="empty">Carregant… (si això no canvia, el JavaScript no s'executa)</p></section>
  <section id="game" class="hidden">
    <div class="bar"><span id="info"></span><span id="timer">0:00</span></div>
    <div id="board"></div>
    <div id="legend"></div>
    <div class="tools" id="tools"></div>
    <div id="msg"></div>
    <div class="cards" id="cards"></div>
    <h2 id="genh"></h2>
    <ul class="gen" id="gen"></ul>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script>
window.addEventListener("error",function(e){var m=(e.message||("No es pot carregar "+(e.target&&(e.target.src||e.target.href))));document.body.insertAdjacentHTML("afterbegin","<pre style='padding:12px;white-space:pre-wrap;color:#c00'>Error: "+m+"</pre>")},true);
</script>
<script src="casos.js"></script>
<script src="ranking_config.js"></script>
<script>
"use strict";

 ca:{title:"Misteri",cas:"Cas",lvl:"Nivell",solved:"Resolt",best:"Millor",place:"Col·loca",mark:"Descarta",note:"Nota",erase:"Goma",undo:"Desfés",check:"Revisa",

  rules:`<p><b>Objectiu.</b> Descobreix qui va matar la víctima (V). L'assassí és l'<b>únic sospitós que és a la mateixa sala que la víctima</b>.</p>

  <p><b>Truc.</b> Si una fila o columna només té una casella lliure, hi va algú; si dues persones només caben a dues files, ningú més hi pot anar.</p>`},

function renderBoard(){
  const texCache={};
  const n=cur.n,b=$("#board"),dk=dark();
  b.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;b.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;
  // files/columnes amb sospitós col·locat
  const rowsU=new Set(),colsU=new Set();
  st.cells.forEach((row,r)=>row.forEach((c,k)=>{if(c.p){rowsU.add(r);colsU.add(k)}}));
  // casella on s'escriu el nom de cada sala: la primera sense objecte (i amb veïnes lliures), per no tapar-lo
  const labelAt={},bestSc={};
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(!cur.pla[r][c])continue;const q=cur.sala[r][c];
    const ob=(rr,cc)=>rr<n&&cc<n&&cur.pla[rr][cc]&&cur.sala[rr][cc]===q&&cur.obj[rr][cc]?1:0;
    const sc=(cur.obj[r][c]?100:0)+ob(r,c+1)*2+ob(r,c+2)+ob(r+1,c);
    if(bestSc[q]===undefined||sc<bestSc[q]){bestSc[q]=sc;labelAt[q]=r+","+c}
  }
  let h="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(!cur.pla[r][c]){h+=`<div class="cell hole"></div>`;continue}
    const s=cur.sala[r][c],cell=st.cells[r][c];
    const diff=(rr,cc)=>rr<0||cc<0||rr>=n||cc>=n||!cur.pla[rr][cc]||cur.sala[rr][cc]!==s;
    const w=(a)=>a?"3px":"0";
    const bw=`border-width:${w(diff(r-1,c))} ${w(diff(r,c+1))} ${w(diff(r+1,c))} ${w(diff(r,c-1))}`;
    const o=cur.obj[r][c],blk=isBlocked(r,c),tx=texCache[s]||(texCache[s]=roomTex(cur.sales[s].ca));
    let cls="cell"+(blk?" blocked":"")+(o&&!blk?" free":"")+(cell.p?" placed":"")+(hlCells&&hlCells.has(r+","+c)?" hl":"")+(hintCells&&hintCells.has(r+","+c)?" hint":"")+((rowsU.has(r)||colsU.has(c))&&!cell.p?" line":"");
    let inner="";
    if(labelAt[s]===r+","+c)inner+=`<span class="rn">${cur.sales[s][lang]}</span>`;
    if(o)inner+=icon(o);
    if(cell.x)inner+=`<span class="mark">✕</span>`;
    else if(auto&&!blk&&!cell.p&&(rowsU.has(r)||colsU.has(c)))inner+=`<span class="mark auto">✕</span>`;
    if(cell.nt.length)inner+=`<span class="notes">${cell.nt.map(x=>x.toLowerCase()).join("")}</span>`;
    if(cell.p)inner+=`<span class="tok${popKey===r+","+c?" pop":""}">${tokHtml(cell.p)}</span>`;
    h+=`<div class="${cls} ${tx.c}" data-r="${r}" data-c="${c}" style="background-color:${tx.t?`color-mix(in srgb,${COLORS(s,dk,cur.escenari)} ${Math.round((1-tx.p)*100)}%,${tx.t})`:COLORS(s,dk,cur.escenari)};${bw}">${inner}</div>`;
  }
  b.innerHTML=h;popKey=null;
}

function renderCards(){
  const placed=new Set();st.cells.forEach(r=>r.forEach(c=>c.p&&placed.add(c.p)));
  const mine={},gen=[];
  cur.pistes.forEach((p,i)=>{if(p.p)(mine[p.p]=mine[p.p]||[]).push(i);else gen.push(i)});
  $("#cards").innerHTML=cur.persones.map(p=>{
    const idx=mine[p.id]||[];
    const done=idx.length&&idx.every(i=>st.crossed.includes(i));
    return `<button class="card ${hintP===p.id&&hintCells?"hintc":""} ${sel===p.id?"sel":""} ${done?"done":""} ${placed.has(p.id)?"plc":""}" data-p="${p.id}"><span class="tok">${tokHtml(p.id)}</span><span class="tx"><b>${p.nom}${p.id==="V"?" · "+t("victim"):""}</b>${idx.map(i=>`<span data-clue="${i}" class="${hlClue===i?"hlc":""}">${clueText(i)}</span>`).join("")}</span>${placed.has(p.id)?'<span class="pl">✓</span>':""}</button>`}).join("");
  $("#genh").style.display=gen.length?"":"none";$("#genh").textContent=t("genh");

}

    case "no_en_sala":return S[r][c]!==cl.sala;
    case "sobre_obj":return O[r][c]===cl.obj;
    case "prop_obj":return D4.some(([a,b])=>dinsC(r+a,c+b)&&S[r+a][c+b]===S[r][c]&&O[r+a][c+b]===cl.obj);
    case "raco":{const w=D4.map(([a,b])=>!dinsC(r+a,c+b)||S[r+a][c+b]!==S[r][c]);return (w[0]||w[1])&&(w[2]||w[3])}
    case "vora":return D4.some(([a,b])=>!dinsC(r+a,c+b));
    case "fila_obj":for(let j=0;j<n;j++)if(j!==c&&O[r][j]===cl.obj)return true;return false;
    case "col_obj":for(let i=0;i<n;i++)if(i!==r&&O[i][c]===cl.obj)return true;return false;
  }
  if(!cl.q)return true;
  const b=pos(cl.q);if(!b)return true;               // l'altra persona encara no està col·locada: no restringeix
  const dr=Math.abs(r-b[0]),dc=Math.abs(c-b[1]);
  switch(cl.t){
    case "costat":return dr+dc===1&&S[r][c]===S[b[0]][b[1]];
    case "nord":return r<b[0];case "sud":return r>b[0];
    case "est":return c>b[1];case "oest":return c<b[1];
    case "diag":return dr===dc&&dr>0;
    case "cavall":return (dr===1&&dc===2)||(dr===2&&dc===1);
    case "mateixa_sala":return S[r][c]===S[b[0]][b[1]];
    case "altra_sala":return S[r][c]!==S[b[0]][b[1]];
  }
  return true;
}
const posUsuari=id=>{for(let r=0;r<cur.n;r++)for(let c=0;c<cur.n;c++)if(st.cells[r][c].p===id)return [r,c];return null};
function celesDePista(i){
  const cl=cur.pistes[i],out=new Set();
  if(cl.t==="compte_sala"){for(let r=0;r<cur.n;r++)for(let c=0;c<cur.n;c++)if(cur.pla[r][c]&&cur.sala[r][c]===cl.sala)out.add(r+","+c);return {cells:out}}
  if(cl.t==="sol"||cl.t==="sol_amb")return {msg:t("hlno")};
  if(cl.q&&!posUsuari(cl.q))return {msg:t("hlnone")};
  for(let r=0;r<cur.n;r++)for(let c=0;c<cur.n;c++)if(cur.pla[r][c]&&!isBlocked(r,c)&&okClue(cl,r,c,posUsuari))out.add(r+","+c);
  return {cells:out};
}

// bombeta: primer assenyala on pot ser la persona més restringida; a la segona pulsació, on va
function bombeta(){
  const bones=new Map();
  cur.persones.forEach(p=>{const s=cur.solucio[p.id];if(st.cells[s[0]][s[1]].p===p.id)bones.set(p.id,s)});
  const pend=cur.persones.filter(p=>!bones.has(p.id));
  if(!pend.length){clearHints();msg(t("hallok"));renderBoard();return}
  snap();st.hints=(st.hints||0)+1;persist();
  clearHints();
  if(hintP&&hintLvl===1&&pend.some(p=>p.id===hintP)){
    const s=cur.solucio[hintP];hintCells=new Set([s[0]+","+s[1]]);hintLvl=2;sel=hintP;
    msg(t("h2")(pName(hintP)));renderBoard();renderCards();return;
  }
  const filesU=new Set([...bones.values()].map(s=>s[0])),colsU=new Set([...bones.values()].map(s=>s[1]));
  const posB=id=>bones.get(id)||null;
  let best=null;
  for(const p of pend){
    const cls=cur.pistes.filter(x=>x.p===p.id);
    const cand=new Set();
    for(let r=0;r<cur.n;r++)for(let c=0;c<cur.n;c++){
      if(!cur.pla[r][c]||isBlocked(r,c)||filesU.has(r)||colsU.has(c))continue;
      if(cls.every(cl=>okClue(cl,r,c,posB)))cand.add(r+","+c);
    }
    const sol=cur.solucio[p.id];cand.add(sol[0]+","+sol[1]);   // la casella correcta hi és sempre
    if(!best||cand.size<best.cand.size)best={p,cand};
  }
  hintP=best.p.id;sel=hintP;
  if(best.cand.size===1){hintCells=best.cand;hintLvl=2;msg(t("hone")(pName(hintP)))}
  else{hintCells=best.cand;hintLvl=1;msg(t("h1")(pName(hintP)))}
  renderBoard();renderCards();
}

function snap(){undo.push(JSON.stringify({cells:st.cells,crossed:st.crossed}));if(undo.length>100)undo.shift()}
function persist(){save("st:"+cur.id,st)}
function msg(s){$("#msg").textContent=s||""}
function apply(r,c,how,force){
  const cell=st.cells[r][c];if(isBlocked(r,c))return;
  clearHints();hintLvl=hintLvl===2?0:hintLvl;
  if(force===undefined)snap();
  if(how==="place"){
    if(!sel)return msg(t("pickfirst"));
    if(cell.p===sel){cell.p=null}
    else{ // un sospitós només pot estar en un lloc
      st.cells.forEach(row=>row.forEach(x=>{if(x.p===sel)x.p=null}));
      cell.p=sel;cell.x=false;popKey=r+","+c;
    }
  }else if(how==="mark"){cell.x=force==="on"?true:force==="off"?false:!cell.x;if(cell.x)cell.p=null}
  else if(how==="note"){
    if(!sel)return msg(t("pickfirst"));
    const k=cell.nt.indexOf(sel);
    if(force==="on"){if(k<0)cell.nt.push(sel)}else if(force==="off"){if(k>=0)cell.nt.splice(k,1)}else k<0?cell.nt.push(sel):cell.nt.splice(k,1);
    cell.nt.sort();
  }else if(how==="erase"){cell.p=null;cell.x=false;cell.nt=[]}
  msg("");persist();renderBoard();renderCards();checkWin();
}

const GH=window.RANKING_GH||{};                        // {repo:"usuari/repositori", branch:"ranking", token:"..."}
const GH_ON=!!(GH.repo&&GH.token);
const GH_API=(GH.api||"https://api.github.com").replace(/\/+$/,"");
const GH_BR=GH.branch||"ranking";
const ghH=()=>({"Authorization":"Bearer "+GH.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"});
const b64d=x=>decodeURIComponent(escape(atob(x.replace(/\s/g,""))));
const b64e=x=>btoa(unescape(encodeURIComponent(x)));
async function ghFetch(url,opt){
  const r=await fetch(GH_API+url,Object.assign({cache:"no-store",headers:ghH()},opt||{}));
  return r;
}
// llegeix ranking.json: {dades, sha}; si no existeix, dades={} i sha=null
async function ghLlegeix(){
  const r=await ghFetch(`/repos/${GH.repo}/contents/ranking.json?ref=${encodeURIComponent(GH_BR)}&_=${Date.now()}`);
  if(r.status===404)return {dades:{},sha:null};
  if(!r.ok)throw new Error("GitHub "+r.status);
  const j=await r.json();
  let d={};try{d=JSON.parse(b64d(j.content))||{}}catch(e){}
  return {dades:d,sha:j.sha};
}
// crea la branca de la classificació a partir de la branca per defecte, si encara no hi és
async function ghBranca(){
  const r=await ghFetch(`/repos/${GH.repo}/git/ref/heads/${encodeURIComponent(GH_BR)}`);
  if(r.ok)return;
  const rep=await ghFetch(`/repos/${GH.repo}`);if(!rep.ok)throw new Error("GitHub "+rep.status);
  const def=(await rep.json()).default_branch||"main";
  const b=await ghFetch(`/repos/${GH.repo}/git/ref/heads/${encodeURIComponent(def)}`);if(!b.ok)throw new Error("GitHub "+b.status);
  const sha=(await b.json()).object.sha;
  const c=await ghFetch(`/repos/${GH.repo}/git/refs`,{method:"POST",body:JSON.stringify({ref:"refs/heads/"+GH_BR,sha})});
  if(!c.ok&&c.status!==422)throw new Error("GitHub "+c.status);
}
async function ghPuja(caseId,t,p,nk){
  for(let intent=0;intent<5;intent++){
    let {dades,sha}=await ghLlegeix();
    if(sha===null)await ghBranca();
    const cas=dades[caseId]||(dades[caseId]={});
    const ant=cas[nk];
    if(ant&&ant.p>=p&&ant.t<=t)return true;
    cas[nk]={t:ant?Math.min(ant.t,t):t,p:Math.max(p,(ant&&ant.p)||0),ts:Date.now()};
    const body={message:"Resultat de "+nk,content:b64e(JSON.stringify(dades)),branch:GH_BR};
    if(sha)body.sha=sha;
    const r=await ghFetch(`/repos/${GH.repo}/contents/ranking.json`,{method:"PUT",body:JSON.stringify(body)});
    if(r.ok)return true;
    if(r.status!==409&&r.status!==422)throw new Error("GitHub "+r.status);   // 409/422: algú ha escrit abans; es torna a provar
    await new Promise(z=>setTimeout(z,300+Math.random()*500));
  }
  throw new Error("GitHub: massa conflictes");
}
const RK_URL=(window.RANKING_URL||"").replace(/\/+$/,"");

const rkSan=n=>(n||"").replace(/[.$#\[\]\/]/g," ").replace(/\s+/g," ").trim().slice(0,16);
function punts(c,t,h){
  const base=[10,20,35,55,80][c.nivell-1]*({6:1,7:1.25,8:1.5,9:1.8}[c.n]||1);
  const par=90*(c.n-4)*(1+.25*(c.nivell-1));            // temps de referència (s)
  return Math.round(base*(1+Math.max(0,1-t/(2*par)))*Math.max(.5,1-.15*(h||0)));   // fins a +100% si és ràpid; cada pista resta un 15% (màx. 50%)
}
const rkOn=()=>GH_ON||!!RK_URL;
async function rkJson(path,opt){
  const r=await fetch(RK_URL+path+".json",opt);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
async function rkPuja(caseId,t,p){
  const nk=rkSan(nick);if(!rkOn()||!nk)return false;
  if(GH_ON)return ghPuja(caseId,t,p,nk);
  const path="/ranking/"+encodeURIComponent(caseId)+"/"+encodeURIComponent(nk);
  const ant=await rkJson(path);
  if(ant&&ant.p>=p&&ant.t<=t)return true;                   // ja hi ha un resultat igual o millor
  const nou={t:t,p:Math.max(p,(ant&&ant.p)||0),ts:Date.now()};
  if(ant&&ant.t<t)nou.t=ant.t;                               // guarda el millor temps
  await rkJson(path,{method:"PUT",body:JSON.stringify(nou)});
  return true;
}

    timer=setTimeout(()=>{long=true;target=null;if(navigator.vibrate)navigator.vibrate(15);apply(+el.dataset.r,+el.dataset.c,"place")},450);
  });
  const cancel=()=>{clearTimeout(timer);timer=null};
  b.addEventListener("pointerup",e=>{
    clearTimeout(timer);const el=cellAt(e)||cellOf(e);
    if(!drag&&!long&&target&&el===target)apply(+el.dataset.r,+el.dataset.c,tool);
    target=null;drag=null;
  });
  b.addEventListener("pointercancel",()=>{cancel();target=null;drag=null});
  b.addEventListener("pointermove",e=>{
    if(!target&&!drag)return;
    const el=cellAt(e);if(!el)return;
    if(!drag){if(el===target)return;cancel();drag={seen:new Set(),first:true,mode:modeFor(target)};paint(target)}
    paint(el);
  });
  b.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ---------- temps ---------- */
function startTimer(){
  stopTimer();$("#timer").textContent=fmt(st.time);
  if(st.done)return;
  timerH=setInterval(()=>{if(document.hidden)return;st.time++;$("#timer").textContent=fmt(st.time);if(st.time%5===0)persist()},1000);
}
function stopTimer(){clearInterval(timerH);timerH=null;if(cur&&st)persist()}


/* ---------- paraules clau amb mini-diagrames ---------- */
/* graella 4x4: . buida, # forat, T casella possible, A persona de la pista, Q persona citada, | / _ parets (només a kwSvg) */
const KW=[
 {g:[".T..","TAT.",".T..","...."],ca:["<b>al costat</b>","casella veïna (dalt, baix, esquerra o dreta) dins la mateixa sala. La veïna ha de ser de la mateixa sala."],fr:["<b>à côté</b>","case voisine (haut, bas, gauche ou droite) dans la même pièce. La voisine doit être dans la même pièce."]},
 {g:["#...","T...","....","...."],ca:["<b>al costat d'una paret</b>","la casella toca una paret exterior de la finca o un forat del plànol."],fr:["<b>contre un mur</b>","la case touche un mur extérieur de la propriété ou un trou du plan."],wall:1},
 {g:["T.T.","....","T.T.","...."],w:[[0,0,3,0],[3,0,3,3],[3,3,0,3],[0,3,0,0]],ca:["<b>racó</b>","casella amb dues parets de la mateixa sala (una horitzontal i una de vertical)."],fr:["<b>coin</b>","case avec deux murs de la même pièce (un horizontal et un vertical)."]},
 {g:["....",".A..","....","...."],w:[[0,0,4,0],[4,0,4,4],[4,4,0,4],[0,4,0,0]],ca:["<b>sol</b>","ningú més a la sala, ni la víctima."],fr:["<b>seul</b>","personne d'autre dans la pièce, pas même la victime."]},
 {g:["Q...","T...","T...","T..."],ca:["<b>nord / sud / est / oest</b>","qualsevol casella en aquella direcció (aquí: al sud de la Q), no només la veïna."],fr:["<b>nord / sud / est / ouest</b>","n'importe quelle case dans cette direction (ici : au sud de Q), pas seulement la voisine."]},
 {g:["T..T",".TT.",".TT.","T..T"],diag:1,ca:["<b>diagonal</b>","la línia sencera en diagonal."],fr:["<b>diagonale</b>","la ligne entière en diagonale."]},
 {g:[".T..","..T.","Q...","..T."],ca:["<b>salt de cavall</b>","com el cavall dels escacs: dues caselles en una direcció i una de costat."],fr:["<b>saut de cavalier</b>","comme le cavalier aux échecs : deux cases dans une direction et une de côté."]},
 {g:["....","TTTT","....","...."],ca:["<b>a la seva fila / columna</b>","a la mateixa fila (o columna) hi ha l'objecte que diu la pista, en qualsevol casella."],fr:["<b>sur sa ligne / colonne</b>","sur la même ligne (ou colonne) se trouve l'objet de l'indice, sur n'importe quelle case."]}
];
function kwSvg(d){
  const c=20;let o=`<svg viewBox="-2 -2 84 84" aria-hidden="true">`;
  d.g.forEach((row,r)=>[...row].forEach((ch,k)=>{
    const x=k*c,y=r*c;
    o+=`<rect class="${ch==="#"?"h":ch==="T"?"t":"g"}" x="${x}" y="${y}" width="${c}" height="${c}" stroke-width="1"/>`;
    if(ch==="A")o+=`<circle class="a" cx="${x+10}" cy="${y+10}" r="8"/><text x="${x+10}" y="${y+10}">A</text>`;
    if(ch==="Q")o+=`<circle class="q" cx="${x+10}" cy="${y+10}" r="8"/><text x="${x+10}" y="${y+10}" style="fill:var(--bg)">Q</text>`;
  }));
  if(d.wall)o+=`<rect class="w" fill="none" x="0" y="0" width="80" height="80"/>`;
  (d.w||[]).forEach(([a,b,e,f])=>o+=`<line class="w" x1="${a*c}" y1="${b*c}" x2="${e*c}" y2="${f*c}"/>`);
  return o+"</svg>";
}
function kwHtml(){return `<div class="kws">`+KW.map(d=>`<div class="kw">${kwSvg(d)}<p>${d[lang][0]}: ${d[lang][1]}</p></div>`).join("")+`</div>`}
function helpHtml(tab){
  return `<button class="close" id="mc">${t("close")}</button><h3>${t("help")}</h3>
  <div class="tabs"><button data-tab="r" class="${tab==="r"?"on":""}">${t("help")}</button><button data-tab="k" class="${tab==="k"?"on":""}">${t("kwtab")}</button></div>
  ${tab==="r"?t("rules"):kwHtml()}
  <div class="row"><button id="mth">${t("theme")}</button><button id="mau">${t("autox")}: ${auto?"✔":"✕"}</button>${cur?`<button id="mrs">${t("reset")}</button>`:""}</div>`}

/* ---------- modals i capçalera ---------- */
function modal(h){$("#sheet").innerHTML=h;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function showHelp(tab){
  modal(helpHtml(tab));
  $("#mc").onclick=closeModal;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showHelp(b.dataset.tab));
  $("#mau").onclick=()=>{auto=!auto;save("auto",auto);if(cur)renderBoard();showHelp(tab)};
  $("#mth").onclick=()=>{const d=document.documentElement;d.dataset.theme=dark()?"light":"dark";save("theme",d.dataset.theme);if(cur)renderBoard();renderCards()};
  if(cur)$("#mrs").onclick=()=>{if(confirm(t("reset")+"?")){st=blank(cur);undo=[];save("st:"+cur.id,st);const pr=prog[cur.id];if(pr){delete pr.solved;save("prog",prog)}closeModal();render();startTimer()}};
}
$("#help").onclick=()=>showHelp("r");
$("#back").onclick=home;
$("#lang").onclick=()=>{lang=lang==="ca"?"fr":"ca";save("lang",lang);$("#lang").textContent=lang==="ca"?"FR":"CA";cur?render():home()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&cur&&st)persist()});
{const th=load("theme",null);document.documentElement.dataset.theme=th||"light"}
$("#lang").textContent=lang==="ca"?"FR":"CA";
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
try{rkCua()}catch(e){}
try{home()}catch(e){document.body.insertAdjacentHTML('afterbegin','<pre style=\"padding:12px;white-space:pre-wrap\">Error: '+e.message+'</pre>')}
</script>
