<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2118">
<title>El crim del mas</title>
<style>
:root{
  --bg:#f4ecdf;--panel:#fffaf1;--ink:#2b2118;--muted:#7a6a58;--line:#2b2118;--accent:#b5472f;--ok:#3c7a4a;--bad:#c0392b;
  --hole:transparent;--cellgrid:rgba(43,33,24,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#1d1813;--panel:#2a231b;--ink:#f1e6d3;--muted:#a89a85;--line:#f1e6d3;--accent:#e0795f;--ok:#6fbf82;--bad:#ff7a69;--cellgrid:rgba(241,230,211,.2)}
}
:root[data-theme=dark]{--bg:#1d1813;--panel:#2a231b;--ink:#f1e6d3;--muted:#a89a85;--line:#f1e6d3;--accent:#e0795f;--ok:#6fbf82;--bad:#ff7a69;--cellgrid:rgba(241,230,211,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:520px;margin:0 auto}
header h1{font-size:1.05rem;margin:0;flex:1;line-height:1.15}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.ib{padding:6px 10px;min-width:40px}
main{max-width:520px;margin:0 auto;padding:0 12px 24px}
.hidden{display:none!important}

/* llista de casos */
.list{display:grid;gap:10px}
.case{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;width:100%}
.case .num{font-size:1.4rem;font-weight:800;width:2.2rem;text-align:center}
.case .meta{flex:1}
.case .meta b{display:block}
.case .meta span{color:var(--muted);font-size:.85rem}
.stamp{color:var(--ok);font-weight:800;border:2px solid var(--ok);border-radius:8px;padding:2px 6px;transform:rotate(-6deg);font-size:.8rem}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--cellgrid)}
.lvl i.on{background:var(--accent)}


/* llista estil col·lecció */
.hero{max-width:520px;margin:0 auto;padding:14px 12px 4px}
.hero .top{display:flex;align-items:center;gap:8px}
.logo{flex:1;font-weight:900;font-size:1.7rem;letter-spacing:.14em;line-height:1}
.logo b{color:var(--accent)}.logo small{display:block;font-size:.62rem;letter-spacing:.12em;font-weight:600;color:var(--muted);margin-top:3px}
.hero select{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 8px}
.alfa{display:flex;gap:10px;align-items:center;margin:12px 0 6px;font-size:.8rem;color:var(--muted)}
.alfa i{font-style:normal;font-weight:800;color:var(--ok);border:2px solid var(--ok);border-radius:6px;padding:3px 6px;font-size:.7rem;letter-spacing:.08em}
.sum{text-align:center;font-size:.95rem;margin:6px 0 10px}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;padding:6px 11px;font-size:.85rem;border-radius:9px;box-shadow:0 2px 0 var(--line)}
.tabs2 button.on{background:var(--accent);color:#fff;border-color:var(--line)}
.sortrow{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin:2px 0 10px}
.sortrow select{flex:1}.sortrow button{padding:7px 10px;font-size:.8rem}
#home.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding-top:6px}
.pc{position:relative;border:2px solid var(--line);border-radius:14px;background:var(--panel);padding:16px 8px 10px;text-align:center;box-shadow:0 3px 0 var(--line);cursor:pointer;display:block;width:100%;font:inherit;color:inherit}
.pc:before{content:"";position:absolute;top:-7px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.pc .nm{display:block;font-weight:700;font-size:.9rem;margin:8px 0 5px;line-height:1.15}
.pill{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1.5px solid currentColor}
.l1{color:#2f8a4e;background:#2f8a4e1f}.l2{color:#4d8f2a;background:#4d8f2a1f}.l3{color:#b57a14;background:#b57a141f}.l4{color:#c0502a;background:#c0502a1f}.l5{color:#8b3fa8;background:#8b3fa81f}
.pc .sz{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;font-weight:600}
.pc .tag{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:700}
.th{display:block;width:84%;margin:0 auto;aspect-ratio:1;position:relative}
.th svg{width:100%;height:100%;display:block;border-radius:4px}
.pc.done .th svg{opacity:.78}
.pc .seal{position:absolute;left:4%;right:4%;top:32%;transform:rotate(-14deg);border:3px solid var(--ok);color:var(--ok);background:color-mix(in srgb,var(--panel) 70%,transparent);font-weight:900;letter-spacing:.06em;font-size:1.05rem;line-height:1.05;border-radius:8px;padding:4px 2px}
.pc .chk{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:.8rem;line-height:22px;font-weight:800}
.pc.env .env,.env .paper,.env .body,.env .flap{display:block}.pc.env .env{position:relative;width:88%;margin:0 auto;aspect-ratio:1.05}
.env .paper{position:absolute;left:12%;right:12%;top:6%;height:56%;overflow:hidden;border-radius:4px 4px 0 0;background:var(--bg);border:1.5px solid var(--cellgrid);transition:transform .35s}
.env .paper svg{width:100%;display:block}
.env .body{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(var(--panel),color-mix(in srgb,var(--panel) 80%,var(--muted)));border:2px solid var(--line);border-radius:0 0 8px 8px}
.env .flap{position:absolute;left:0;right:0;top:20%;height:46%;background:color-mix(in srgb,var(--panel) 84%,var(--muted));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .35s}
.env .flapl{position:absolute;left:0;right:0;top:20%;height:46%;z-index:3;pointer-events:none}
.env .lens{position:absolute;left:50%;top:44%;transform:translateX(-50%);white-space:nowrap;z-index:4;display:flex;gap:4px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:3px 12px;font-weight:800;font-size:.95rem;box-shadow:0 2px 0 var(--line)}
.pc.env.open .flap{transform:rotateX(180deg)}.pc.env.open .paper{transform:translateY(-14%)}
.pc.prog .chk{background:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
.nws{display:none}

/* tauler */
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;padding:2px 2px 8px}
#board{display:grid;gap:0;width:100%;aspect-ratio:1;border-radius:6px;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border:0 solid var(--line);outline:1px solid var(--cellgrid);outline-offset:-1px;overflow:hidden}
.cell.hole{background:var(--hole);outline:none}
.cell.blocked{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.06) 6px 7px)}
.cell.line{box-shadow:inset 0 0 0 100px rgba(43,33,24,.13)}
.cell .rn{position:absolute;left:3px;top:1px;font-size:clamp(7px,2.2vw,10px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75;pointer-events:none}
.cell svg.obj{position:absolute;inset:14%;width:72%;height:72%;color:var(--ink);opacity:.8;pointer-events:none}
.cell.free svg.obj{inset:auto 2px 2px auto;width:34%;height:34%;opacity:.55}
.cell.placed svg.obj{opacity:.35}
.mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,7vw,32px);font-weight:700;color:var(--bad);pointer-events:none}
.notes{position:absolute;inset:0;padding:2px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:0 2px;font-size:clamp(8px,2.6vw,12px);font-weight:700;color:var(--muted);line-height:1.1;pointer-events:none}
.tok{position:relative;width:70%;height:70%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(14px,5vw,24px);color:#fff;border:2px solid var(--line);pointer-events:none;z-index:2}
.cell.bad{outline:3px solid var(--bad);outline-offset:-3px}

/* eines */
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.tools button{padding:8px 0;font-size:1.05rem}
.tools button.on{background:var(--ink);color:var(--bg)}
.tools button small{display:block;font-size:.62rem;opacity:.8}
#msg{min-height:1.4em;text-align:center;font-weight:600;margin:0 0 8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:8px;border-radius:12px;width:100%}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.card .tok{flex:none;width:34px;height:34px;font-size:1rem}
.card .tx b{display:block;font-size:.9rem}
.card .tx span{font-size:.8rem;color:var(--muted);line-height:1.25;display:block}
.card.done .tx span{text-decoration:line-through;opacity:.6}
.card .pl{margin-left:auto;color:var(--ok);font-weight:800}
h2{font-size:.95rem;margin:16px 0 6px}
.gen{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.gen li{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem}
.gen li.done{text-decoration:line-through;opacity:.6}

/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:16px 16px 28px}
.sheet h3{margin:0 0 8px}
.sheet p,.sheet li{font-size:.92rem;line-height:1.4}
.sheet ul{padding-left:18px;margin:6px 0}
.sheet .close{float:right}
.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs button{flex:1;padding:6px 8px;font-size:.88rem}.tabs button.on{background:var(--ink);color:var(--bg)}
.kws{display:grid;gap:10px}.kw{display:flex;gap:12px;align-items:center}.kw svg{flex:none;width:84px;height:84px}.kw p{margin:0}
.kw .g{fill:var(--panel);stroke:var(--cellgrid)}.kw .h{fill:var(--cellgrid)}.kw .t{fill:var(--accent);fill-opacity:.35}.kw .w{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}.kw .a{fill:var(--accent)}.kw .q{fill:var(--ink)}.kw text{font:700 11px system-ui;fill:#fff;text-anchor:middle;dominant-baseline:central}
.win{text-align:center}
.win .big{font-size:2.6rem}
.win .culprit{display:flex;justify-content:center;margin:10px 0}
.win .culprit .tok{width:64px;height:64px;font-size:1.8rem}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <button class="ib hidden" id="back" aria-label="Enrere">←</button>
  <h1 id="title"></h1>
  <button class="ib" id="help">?</button>
  <button class="ib" id="lang">FR</button>
</header>
<main>
  <section id="hero" class="hero"></section>
  <section id="home" class="grid"><p id="boot" class="empty">Carregant… (si això no canvia, el JavaScript no s'executa)</p></section>
  <section id="game" class="hidden">
    <div class="bar"><span id="info"></span><span id="timer">0:00</span></div>
    <div id="board"></div>
    <div class="tools" id="tools"></div>
    <div id="msg"></div>
    <div class="cards" id="cards"></div>
    <h2 id="genh"></h2>
    <ul class="gen" id="gen"></ul>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script>
window.addEventListener("error",function(e){var m=(e.message||("No es pot carregar "+(e.target&&(e.target.src||e.target.href))));document.body.insertAdjacentHTML("afterbegin","<pre style='padding:12px;white-space:pre-wrap;color:#c00'>Error: "+m+"</pre>")},true);
</script>
<script src="casos.js"></script>
<script>
"use strict";
const T={
 ca:{title:"El crim del mas",cas:"Cas",lvl:"Nivell",solved:"Resolt",best:"Millor",place:"Col·loca",mark:"Descarta",note:"Nota",erase:"Goma",undo:"Desfés",check:"Revisa",
  genh:"Pistes generals",ok:"Tot correcte fins ara!",errs:n=>n+(n==1?" error marcat en vermell":" errors marcats en vermell"),pickfirst:"Tria primer un sospitós.",victim:"Víctima",
  win:"Cas resolt!",culp:"L'assassí és",in:"Era a la mateixa sala que la víctima, i era l'únic.",time:"Temps",again:"Llista de casos",next:"Cas següent",close:"Tanca",
  help:"Com es juga",kwtab:"Paraules clau",theme:"Tema",reset:"Reinicia el cas",
  rules:`<p><b>Objectiu.</b> Descobreix qui va matar la víctima (V). L'assassí és l'<b>únic sospitós que és a la mateixa sala que la víctima</b>.</p>
  <p><b>Regles.</b></p><ul><li>Hi ha una persona a cada fila i a cada columna.</li><li>Només es pot posar gent a caselles lliures: els objectes grossos (taula, tonell, pou…) bloquegen la casella; banc, carro o cadira, no.</li><li>Cada targeta té una pista; també n'hi ha de generals. Cada cas té una única solució.</li></ul>
  <p><b>Controls.</b></p><ul><li>Toca un sospitós per triar-lo.</li><li>Eina <b>Col·loca</b>: toca una casella per posar-hi el sospitós. Mantenir premut una casella també el col·loca, sigui quina sigui l'eina.</li><li><b>Descarta</b> (✕): marca una casella impossible. <b>Nota</b>: hi apunta la lletra del sospitós. <b>Goma</b>: buida la casella.</li><li>Toca una pista per ratllar-la quan l'hagis aprofitat.</li><li>Quan poses un sospitós, la seva fila i columna s'enfosqueixen.</li></ul>
  <p><b>Truc.</b> Si una fila o columna només té una casella lliure, hi va algú; si dues persones només caben a dues files, ningú més hi pot anar.</p>`},
 fr:{title:"Le crime du mas",cas:"Cas",lvl:"Niveau",solved:"Résolu",best:"Meilleur",place:"Placer",mark:"Écarter",note:"Note",erase:"Gomme",undo:"Annuler",check:"Vérifier",
  genh:"Indices généraux",ok:"Tout est correct jusqu'ici !",errs:n=>n+(n==1?" erreur marquée en rouge":" erreurs marquées en rouge"),pickfirst:"Choisis d'abord un suspect.",victim:"Victime",
  win:"Affaire résolue !",culp:"Le coupable est",in:"Il était dans la même pièce que la victime, et il était le seul.",time:"Temps",again:"Liste des cas",next:"Cas suivant",close:"Fermer",
  help:"Règles du jeu",kwtab:"Mots clés",theme:"Thème",reset:"Recommencer le cas",
  rules:`<p><b>But.</b> Découvre qui a tué la victime (V). Le coupable est le <b>seul suspect dans la même pièce que la victime</b>.</p>
  <p><b>Règles.</b></p><ul><li>Une personne par ligne et par colonne.</li><li>On ne place les gens que sur des cases libres : les gros objets (table, tonneau, puits…) bloquent la case ; banc, charrette ou chaise, non.</li><li>Chaque carte a un indice ; il y en a aussi des généraux. Chaque cas a une seule solution.</li></ul>
  <p><b>Commandes.</b></p><ul><li>Touche un suspect pour le choisir.</li><li>Outil <b>Placer</b> : touche une case pour y mettre le suspect. Un appui long sur une case le place aussi, quel que soit l'outil.</li><li><b>Écarter</b> (✕) : marque une case impossible. <b>Note</b> : y inscrit la lettre du suspect. <b>Gomme</b> : vide la case.</li><li>Touche un indice pour le barrer quand tu l'as exploité.</li><li>Quand un suspect est placé, sa ligne et sa colonne s'assombrissent.</li></ul>
  <p><b>Astuce.</b> Si une ligne ou colonne n'a qu'une case libre, quelqu'un y est ; si deux personnes ne tiennent que sur deux lignes, personne d'autre ne peut y aller.</p>`}
};
const ROOMHUE=[28,205,95,330,50,265,175,10];
const PERSONHUE=[8,210,130,280,35,175,320,60,95,245];
const ICONS={
 taula:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M6 12v8M18 12v8"/>',
 llar:'<path d="M3 21V8l9-5 9 5v13zM9 21v-6h6v6"/><path d="M12 13c-2-2 0-3 0-5 2 1 3 4 0 5z"/>',
 barril:'<ellipse cx="12" cy="12" rx="7" ry="9"/><path d="M5.5 8c4 2 9 2 13 0M5.5 16c4-2 9-2 13 0"/>',
 armari:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M12 3v18M10 12v1M14 12v1"/>',
 figuera:'<circle cx="12" cy="9" r="6"/><path d="M12 15v6M9 21h6"/>',
 pou:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M3 12h4"/>',
 banc:'<path d="M3 9h18M3 13h18M5 13v7M19 13v7"/>',
 carro:'<rect x="3" y="7" width="14" height="8"/><path d="M17 10h4"/><circle cx="7" cy="18" r="3"/><circle cx="15" cy="18" r="3"/>',
 balanci:'<path d="M7 3l2 12h8M9 9h7"/><path d="M4 19c4 3 12 3 16 0"/>',
 cadira:'<path d="M7 3v18M7 12h10v9M17 12V8"/>'
};
const COLORS=(i,dark)=>`hsl(${ROOMHUE[i%8]} ${dark?22:60}% ${dark?25:84}%)`;
const $=s=>document.querySelector(s);
const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
const save=(k,v)=>{try{localStorage.setItem("misteri:"+k,JSON.stringify(v))}catch(e){}};
const load=(k,d)=>{try{const v=localStorage.getItem("misteri:"+k);return v?JSON.parse(v):d}catch(e){return d}};

let lang=load("lang",(navigator.language||"ca").startsWith("fr")?"fr":"ca");if(lang!=="ca"&&lang!=="fr")lang="ca";
let prog=load("prog",{});          // id -> {solved,best}
let cur=null, st=null, tool="place", sel=null, timerH=null, undo=[];
const t=k=>T[lang][k];

function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function dots(n){return '<span class="lvl">'+[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")+"</span>"}

/* ---------- llista ---------- */
const H={
 ca:{lv:["Tots","Molt fàcil","Fàcil","Mitjà","Difícil","Expert"],pz:"enigmes",dn:"completats",sort:"Ordena per:",sd:"Dificultat",ss:"Mida",sn:"Nom",hide:"Amaga els completats",show:"Mostra els completats",
  alfa:"Benvingut a la versió alfa: és un projecte en curs. Les funcions poden canviar.",seal:"CAS<br>RESOLT",none:"Cap cas amb aquests filtres.",sub:"Puzles de lògica de crims"},
 fr:{lv:["Tous","Très facile","Facile","Moyen","Difficile","Expert"],pz:"énigmes",dn:"résolues",sort:"Trier par :",sd:"Difficulté",ss:"Taille",sn:"Nom",hide:"Masquer les résolues",show:"Afficher les résolues",
  alfa:"Bienvenue dans la version alpha : un projet en cours. Les fonctions peuvent changer.",seal:"AFFAIRE<br>RÉSOLUE",none:"Aucun cas avec ces filtres.",sub:"Énigmes de logique criminelle"}};
let hf=load("hf",0),hs=load("hs","d"),hh=load("hh",false);
const caseName=c=>(c.nom&&c.nom[lang])||c.titol[lang];
function thumb(c,mode){
  const n=c.n,k=10,dk=dark(),sv=mode==="closed"?null:load("st:"+c.id,null);
  let o=`<svg viewBox="0 0 ${n*k} ${n*k}" aria-hidden="true">`;
  const dn=(r,q)=>r>=0&&q>=0&&r<n&&q<n&&c.pla[r][q];
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){if(!c.pla[r][q])continue;
    o+=`<rect x="${q*k}" y="${r*k}" width="${k}" height="${k}" fill="${COLORS(c.sala[r][q],dk)}"/>`;
    const ob=c.obj[r][q];if(ob&&c.objectes[ob].bloqueja)o+=`<rect x="${q*k+2.5}" y="${r*k+2.5}" width="5" height="5" rx="1" fill="${dk?"#f1e6d3":"#2b2118"}" opacity=".55"/>`;}
  const sol=mode==="solved";
  if(sol||sv){for(let r=0;r<n;r++)for(let q=0;q<n;q++){if(!c.pla[r][q])continue;
    const ce=sv&&sv.cells[r][q],x=q*k+5,y=r*k+5;
    let pid=null;if(sol){for(const p of c.persones){const s2=c.solucio[p.id];if(s2[0]===r&&s2[1]===q)pid=p.id}}else if(ce&&ce.p)pid=ce.p;
    if(pid){const i=c.persones.findIndex(p=>p.id===pid);o+=`<circle cx="${x}" cy="${y}" r="4.1" fill="hsl(${PERSONHUE[i%10]} 55% 40%)"/><text x="${x}" y="${y+.4}" font-size="5.2" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">${pid}</text>`}
    else if(sol||(ce&&ce.x))o+=`<path d="M${x-2.4} ${y-2.4}L${x+2.4} ${y+2.4}M${x+2.4} ${y-2.4}L${x-2.4} ${y+2.4}" stroke="${dk?"#f1e6d3":"#2b2118"}" stroke-width="1" opacity=".5"/>`}}
  const w=dk?"#f1e6d3":"#2b2118";
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){if(!c.pla[r][q])continue;const s0=c.sala[r][q];
    if(!dn(r-1,q)||c.sala[r-1][q]!==s0)o+=`<line x1="${q*k}" y1="${r*k}" x2="${q*k+k}" y2="${r*k}" stroke="${w}" stroke-width="1.3"/>`;
    if(!dn(r+1,q)||c.sala[r+1][q]!==s0)o+=`<line x1="${q*k}" y1="${r*k+k}" x2="${q*k+k}" y2="${r*k+k}" stroke="${w}" stroke-width="1.3"/>`;
    if(!dn(r,q-1)||c.sala[r][q-1]!==s0)o+=`<line x1="${q*k}" y1="${r*k}" x2="${q*k}" y2="${r*k+k}" stroke="${w}" stroke-width="1.3"/>`;
    if(!dn(r,q+1)||c.sala[r][q+1]!==s0)o+=`<line x1="${q*k+k}" y1="${r*k}" x2="${q*k+k}" y2="${r*k+k}" stroke="${w}" stroke-width="1.3"/>`}
  return o+"</svg>"}
function pcCard(c,i){
  const p=prog[c.id]||{},h=H[lang],started=!!load("st:"+c.id,null),nm=caseName(c),
   meta=`<span class="pill l${c.nivell}">${h.lv[c.nivell]}</span><span class="sz">${c.n}×${c.n}${p.best?" · ⏱ "+fmt(p.best):""}</span>`;
  if(p.solved)return `<button class="pc done" data-i="${i}"><span class="chk">✓</span><span class="th">${thumb(c,"solved")}<span class="seal">${h.seal}</span></span><span class="nm">${nm}</span>${meta}</button>`;
  if(started)return `<button class="pc prog" data-i="${i}"><span class="chk">…</span><span class="th">${thumb(c,"prog")}</span><span class="nm">${nm}</span>${meta}</button>`;
  const nc=c.textos.ca.length;
  return `<button class="pc env" data-i="${i}"><span class="env"><span class="paper">${thumb(c,"closed")}</span><span class="body"></span><span class="flap"></span><span class="lens">🔍 ${nc}</span></span><span class="nm">${nm}</span>${meta}</button>`}
function home(){
  stopTimer();cur=null;
  $("header").classList.add("hidden");
  $("#game").classList.add("hidden");$("#home").classList.remove("hidden");$("#back").classList.add("hidden");
  document.title=t("title");
  const h=H[lang],done=CASOS.filter(c=>(prog[c.id]||{}).solved).length;
  let idx=CASOS.map((c,i)=>i).filter(i=>(hf===0||CASOS[i].nivell===hf)&&!(hh&&(prog[CASOS[i].id]||{}).solved));
  idx.sort((a,b)=>{const A=CASOS[a],B=CASOS[b];
    if(hs==="m")return A.n-B.n||A.nivell-B.nivell||a-b;
    if(hs==="n")return caseName(A).localeCompare(caseName(B),lang);
    return A.nivell-B.nivell||A.n-B.n||a-b});
  $("#hero").innerHTML=`<div class="top"><div class="logo">MIST<b>E</b>RI<small>${h.sub}</small></div>
   <select id="hl" aria-label="Idioma"><option value="ca"${lang==="ca"?" selected":""}>Català</option><option value="fr"${lang==="fr"?" selected":""}>Français</option></select>
   <button class="ib" id="hth" aria-label="${t("theme")}">${dark()?"☀":"☾"}</button><button class="ib" id="hq">?</button></div>
   <div class="alfa"><i>ALFA</i><span>${h.alfa}</span></div>
   <div class="sum"><b>${CASOS.length}</b> ${h.pz} · <b>${done}</b> ${h.dn}</div>
   <div class="tabs2">${h.lv.map((x,j)=>`<button data-f="${j}" class="${hf===j?"on":""}">${x}</button>`).join("")}</div>
   <div class="sortrow"><span>${h.sort}</span><select id="hsel"><option value="d"${hs==="d"?" selected":""}>${h.sd}</option><option value="m"${hs==="m"?" selected":""}>${h.ss}</option><option value="n"${hs==="n"?" selected":""}>${h.sn}</option></select><button id="hhd">${hh?h.show:h.hide}</button></div>`;
  $("#home").innerHTML=idx.length?idx.map(i=>pcCard(CASOS[i],i)).join(""):`<p class="empty">${h.none}</p>`;
  $("#hero").classList.remove("hidden");
  $("#hl").onchange=e=>{lang=e.target.value;save("lang",lang);home()};
  $("#hth").onclick=()=>{const d=document.documentElement;d.dataset.theme=dark()?"light":"dark";save("theme",d.dataset.theme);home()};
  $("#hq").onclick=()=>showHelp("r");
  $("#hsel").onchange=e=>{hs=e.target.value;save("hs",hs);home()};
  $("#hhd").onclick=()=>{hh=!hh;save("hh",hh);home()};
  document.querySelectorAll(".tabs2 button").forEach(b=>b.onclick=()=>{hf=+b.dataset.f;save("hf",hf);home()});
}
$("#home").onclick=e=>{const b=e.target.closest(".pc");if(!b)return;const i=+b.dataset.i;
  if(b.classList.contains("env")){b.classList.add("open");setTimeout(()=>obreCas(i),380)}else obreCas(i)};

/* ---------- partida ---------- */
function blank(c){return {cells:Array.from({length:c.n},()=>Array.from({length:c.n},()=>({p:null,x:false,nt:[]}))),time:0,done:false,crossed:[]}}
function obreCas(i){
  cur=CASOS[i];cur._i=i;
  st=load("st:"+cur.id,null)||blank(cur);undo=[];
  sel=cur.persones[0].id;tool="place";
  $("#home").classList.add("hidden");$("#hero").classList.add("hidden");$("header").classList.remove("hidden");$("#game").classList.remove("hidden");$("#back").classList.remove("hidden");
  render();startTimer();
}
const isBlocked=(r,c)=>{const o=cur.obj[r][c];return !!o&&cur.objectes[o].bloqueja};
const pIdx=id=>cur.persones.findIndex(p=>p.id===id);
const pName=id=>cur.persones[pIdx(id)].nom;
const tokStyle=id=>`background:hsl(${PERSONHUE[pIdx(id)%10]} 55% ${dark()?42:40}%)`;

function render(){
  document.documentElement.lang=lang;document.title=t("title");
  $("#title").innerHTML=`${caseName(cur)}<small>${cur.titol[lang]} · ${t("cas")} ${cur._i+1}</small>`;
  $("#info").innerHTML=`${t("lvl")} ${dots(cur.nivell)} · ${cur.n}×${cur.n}`;
  renderBoard();renderTools();renderCards();
}
function renderBoard(){
  const n=cur.n,b=$("#board"),dk=dark();
  b.style.gridTemplateColumns=`repeat(${n},1fr)`;
  // files/columnes amb sospitós col·locat
  const rowsU=new Set(),colsU=new Set();
  st.cells.forEach((row,r)=>row.forEach((c,k)=>{if(c.p){rowsU.add(r);colsU.add(k)}}));
  const seen=new Set();let h="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(!cur.pla[r][c]){h+=`<div class="cell hole"></div>`;continue}
    const s=cur.sala[r][c],cell=st.cells[r][c];
    const diff=(rr,cc)=>rr<0||cc<0||rr>=n||cc>=n||!cur.pla[rr][cc]||cur.sala[rr][cc]!==s;
    const w=(a)=>a?"3px":"0";
    const bw=`border-width:${w(diff(r-1,c))} ${w(diff(r,c+1))} ${w(diff(r+1,c))} ${w(diff(r,c-1))}`;
    const o=cur.obj[r][c],blk=isBlocked(r,c);
    let cls="cell"+(blk?" blocked":"")+(o&&!blk?" free":"")+(cell.p?" placed":"")+((rowsU.has(r)||colsU.has(c))&&!cell.p?" line":"");
    let inner="";
    if(!seen.has(s)){seen.add(s);inner+=`<span class="rn">${cur.sales[s][lang]}</span>`}
    if(o)inner+=`<svg class="obj" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[o]||""}</svg>`;
    if(cell.x)inner+=`<span class="mark">✕</span>`;
    if(cell.nt.length)inner+=`<span class="notes">${cell.nt.map(x=>x.toLowerCase()).join("")}</span>`;
    if(cell.p)inner+=`<span class="tok" style="${tokStyle(cell.p)}">${cell.p}</span>`;
    h+=`<div class="${cls}" data-r="${r}" data-c="${c}" style="background-color:${COLORS(s,dk)};${bw}">${inner}</div>`;
  }
  b.innerHTML=h;
}
function renderTools(){
  const L=[["place","👤",t("place")],["mark","✕",t("mark")],["note","✎",t("note")],["erase","⌫",t("erase")],["undo","↶",t("undo")],["check","✔",t("check")]];
  $("#tools").innerHTML=L.map(([k,i,l])=>`<button data-k="${k}" class="${k===tool?"on":""}">${i}<small>${l}</small></button>`).join("");
}
function clueText(i){return cur.textos[lang][i]}
function renderCards(){
  const placed=new Set();st.cells.forEach(r=>r.forEach(c=>c.p&&placed.add(c.p)));
  const mine={},gen=[];
  cur.pistes.forEach((p,i)=>{if(p.p)(mine[p.p]=mine[p.p]||[]).push(i);else gen.push(i)});
  $("#cards").innerHTML=cur.persones.map(p=>{
    const idx=mine[p.id]||[];
    const done=idx.length&&idx.every(i=>st.crossed.includes(i));
    return `<button class="card ${sel===p.id?"sel":""} ${done?"done":""}" data-p="${p.id}"><span class="tok" style="${tokStyle(p.id)}">${p.id}</span><span class="tx"><b>${p.nom}${p.id==="V"?" · "+t("victim"):""}</b>${idx.map(i=>`<span data-clue="${i}">${clueText(i)}</span>`).join("")}</span>${placed.has(p.id)?'<span class="pl">✓</span>':""}</button>`}).join("");
  $("#genh").style.display=gen.length?"":"none";$("#genh").textContent=t("genh");
  $("#gen").innerHTML=gen.map(i=>`<li data-clue="${i}" class="${st.crossed.includes(i)?"done":""}">${clueText(i)}</li>`).join("");
}
$("#cards").onclick=e=>{
  const cl=e.target.closest("[data-clue]"),card=e.target.closest(".card");
  if(!card)return;
  if(sel===card.dataset.p&&cl){toggleClue(+cl.dataset.clue);return}
  sel=card.dataset.p;if(tool==="erase"||tool==="mark")tool="place";renderTools();renderCards();
};
$("#gen").onclick=e=>{const li=e.target.closest("[data-clue]");if(li)toggleClue(+li.dataset.clue)};
function toggleClue(i){snap();const a=st.crossed,k=a.indexOf(i);k<0?a.push(i):a.splice(k,1);persist();renderCards()}

/* ---------- accions ---------- */
function snap(){undo.push(JSON.stringify({cells:st.cells,crossed:st.crossed}));if(undo.length>100)undo.shift()}
function persist(){save("st:"+cur.id,st)}
function msg(s){$("#msg").textContent=s||""}
function apply(r,c,how){
  const cell=st.cells[r][c];if(isBlocked(r,c))return;
  snap();
  if(how==="place"){
    if(!sel)return msg(t("pickfirst"));
    if(cell.p===sel){cell.p=null}
    else{ // un sospitós només pot estar en un lloc
      st.cells.forEach(row=>row.forEach(x=>{if(x.p===sel)x.p=null}));
      cell.p=sel;cell.x=false;
    }
  }else if(how==="mark"){cell.x=!cell.x;if(cell.x)cell.p=null}
  else if(how==="note"){
    if(!sel)return msg(t("pickfirst"));
    const k=cell.nt.indexOf(sel);k<0?cell.nt.push(sel):cell.nt.splice(k,1);cell.nt.sort();
  }else if(how==="erase"){cell.p=null;cell.x=false;cell.nt=[]}
  msg("");persist();renderBoard();renderCards();checkWin();
}
$("#tools").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;
  if(k==="undo"){const s=undo.pop();if(s){const o=JSON.parse(s);st.cells=o.cells;st.crossed=o.crossed;persist();renderBoard();renderCards()}return}
  if(k==="check")return check();
  tool=k;renderTools();
};
function check(){
  let bad=0;
  document.querySelectorAll("#board .cell[data-r]").forEach(el=>{
    const r=+el.dataset.r,c=+el.dataset.c,p=st.cells[r][c].p;
    if(p){const s=cur.solucio[p];if(s[0]!==r||s[1]!==c){bad++;el.classList.add("bad")}}
  });
  msg(bad?t("errs")(bad):t("ok"));
  if(bad)setTimeout(()=>document.querySelectorAll(".cell.bad").forEach(e=>e.classList.remove("bad")),2500);
}
function checkWin(){
  if(st.done)return;
  for(const p of cur.persones){
    const s=cur.solucio[p.id],c=st.cells[s[0]][s[1]];
    if(c.p!==p.id)return;
  }
  st.done=true;persist();stopTimer();
  const pr=prog[cur.id]||{};pr.solved=true;if(!pr.best||st.time<pr.best)pr.best=st.time;prog[cur.id]=pr;save("prog",prog);
  setTimeout(winModal,350);
}
function winModal(){
  const a=cur.assassi,next=CASOS[cur._i+1];
  modal(`<div class="win"><div class="big">🔍</div><h3>${t("win")}</h3><p>${t("culp")}</p><div class="culprit"><span class="tok" style="${tokStyle(a)}">${a}</span></div><h3>${pName(a)}</h3><p>${t("in")}</p><p>${t("time")}: <b>${fmt(st.time)}</b></p>
  <div class="row"><button id="mhome">${t("again")}</button>${next?`<button id="mnext">${t("next")}</button>`:""}</div></div>`);
  $("#mhome").onclick=()=>{closeModal();home()};
  if(next)$("#mnext").onclick=()=>{closeModal();obreCas(cur._i+1)};
}

/* tocs i pulsació llarga al tauler */
(()=>{
  const b=$("#board");let timer=null,long=false,target=null;
  const cellOf=e=>e.target.closest(".cell[data-r]");
  b.addEventListener("pointerdown",e=>{
    const el=cellOf(e);if(!el)return;target=el;long=false;
    timer=setTimeout(()=>{long=true;if(navigator.vibrate)navigator.vibrate(15);apply(+el.dataset.r,+el.dataset.c,"place")},450);
  });
  const cancel=()=>{clearTimeout(timer);timer=null};
  b.addEventListener("pointerup",e=>{
    const el=cellOf(e);clearTimeout(timer);
    if(!long&&el&&el===target)apply(+el.dataset.r,+el.dataset.c,tool);
    target=null;
  });
  b.addEventListener("pointercancel",cancel);
  b.addEventListener("pointermove",e=>{if(target&&cellOf(e)!==target){cancel();target=null}});
  b.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ---------- temps ---------- */
function startTimer(){
  stopTimer();$("#timer").textContent=fmt(st.time);
  if(st.done)return;
  timerH=setInterval(()=>{if(document.hidden)return;st.time++;$("#timer").textContent=fmt(st.time);if(st.time%5===0)persist()},1000);
}
function stopTimer(){clearInterval(timerH);timerH=null;if(cur&&st)persist()}


/* ---------- paraules clau amb mini-diagrames ---------- */
/* graella 4x4: . buida, # forat, T casella possible, A persona de la pista, Q persona citada, | / _ parets (només a kwSvg) */
const KW=[
 {g:[".T..","TAT.",".T..","...."],ca:["<b>al costat</b>","casella veïna (dalt, baix, esquerra o dreta) dins la mateixa sala. La veïna ha de ser de la mateixa sala."],fr:["<b>à côté</b>","case voisine (haut, bas, gauche ou droite) dans la même pièce. La voisine doit être dans la même pièce."]},
 {g:["#...","T...","....","...."],ca:["<b>al costat d'una paret</b>","la casella toca una paret exterior de la finca o un forat del plànol."],fr:["<b>contre un mur</b>","la case touche un mur extérieur de la propriété ou un trou du plan."],wall:1},
 {g:["T.T.","....","T.T.","...."],w:[[0,0,3,0],[3,0,3,3],[3,3,0,3],[0,3,0,0]],ca:["<b>racó</b>","casella amb dues parets de la mateixa sala (una horitzontal i una de vertical)."],fr:["<b>coin</b>","case avec deux murs de la même pièce (un horizontal et un vertical)."]},
 {g:["....",".A..","....","...."],w:[[0,0,4,0],[4,0,4,4],[4,4,0,4],[0,4,0,0]],ca:["<b>sol</b>","ningú més a la sala, ni la víctima."],fr:["<b>seul</b>","personne d'autre dans la pièce, pas même la victime."]},
 {g:["Q...","T...","T...","T..."],ca:["<b>nord / sud / est / oest</b>","qualsevol casella en aquella direcció (aquí: al sud de la Q), no només la veïna."],fr:["<b>nord / sud / est / ouest</b>","n'importe quelle case dans cette direction (ici : au sud de Q), pas seulement la voisine."]},
 {g:["T..T",".TT.",".TT.","T..T"],diag:1,ca:["<b>diagonal</b>","la línia sencera en diagonal."],fr:["<b>diagonale</b>","la ligne entière en diagonale."]},
 {g:[".T..","..T.","Q...","..T."],ca:["<b>salt de cavall</b>","com el cavall dels escacs: dues caselles en una direcció i una de costat."],fr:["<b>saut de cavalier</b>","comme le cavalier aux échecs : deux cases dans une direction et une de côté."]},
 {g:["....","TTTT","....","...."],ca:["<b>a la seva fila / columna</b>","a la mateixa fila (o columna) hi ha l'objecte que diu la pista, en qualsevol casella."],fr:["<b>sur sa ligne / colonne</b>","sur la même ligne (ou colonne) se trouve l'objet de l'indice, sur n'importe quelle case."]}
];
function kwSvg(d){
  const c=20;let o=`<svg viewBox="-2 -2 84 84" aria-hidden="true">`;
  d.g.forEach((row,r)=>[...row].forEach((ch,k)=>{
    const x=k*c,y=r*c;
    o+=`<rect class="${ch==="#"?"h":ch==="T"?"t":"g"}" x="${x}" y="${y}" width="${c}" height="${c}" stroke-width="1"/>`;
    if(ch==="A")o+=`<circle class="a" cx="${x+10}" cy="${y+10}" r="8"/><text x="${x+10}" y="${y+10}">A</text>`;
    if(ch==="Q")o+=`<circle class="q" cx="${x+10}" cy="${y+10}" r="8"/><text x="${x+10}" y="${y+10}" style="fill:var(--bg)">Q</text>`;
  }));
  if(d.wall)o+=`<rect class="w" fill="none" x="0" y="0" width="80" height="80"/>`;
  (d.w||[]).forEach(([a,b,e,f])=>o+=`<line class="w" x1="${a*c}" y1="${b*c}" x2="${e*c}" y2="${f*c}"/>`);
  return o+"</svg>";
}
function kwHtml(){return `<div class="kws">`+KW.map(d=>`<div class="kw">${kwSvg(d)}<p>${d[lang][0]}: ${d[lang][1]}</p></div>`).join("")+`</div>`}
function helpHtml(tab){
  return `<button class="close" id="mc">${t("close")}</button><h3>${t("help")}</h3>
  <div class="tabs"><button data-tab="r" class="${tab==="r"?"on":""}">${t("help")}</button><button data-tab="k" class="${tab==="k"?"on":""}">${t("kwtab")}</button></div>
  ${tab==="r"?t("rules"):kwHtml()}
  <div class="row"><button id="mth">${t("theme")}</button>${cur?`<button id="mrs">${t("reset")}</button>`:""}</div>`}

/* ---------- modals i capçalera ---------- */
function modal(h){$("#sheet").innerHTML=h;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function showHelp(tab){
  modal(helpHtml(tab));
  $("#mc").onclick=closeModal;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showHelp(b.dataset.tab));
  $("#mth").onclick=()=>{const d=document.documentElement;d.dataset.theme=dark()?"light":"dark";save("theme",d.dataset.theme);if(cur)renderBoard();renderCards()};
  if(cur)$("#mrs").onclick=()=>{if(confirm(t("reset")+"?")){st=blank(cur);undo=[];save("st:"+cur.id,st);const pr=prog[cur.id];if(pr){delete pr.solved;save("prog",prog)}closeModal();render();startTimer()}};
}
$("#help").onclick=()=>showHelp("r");
$("#back").onclick=home;
$("#lang").onclick=()=>{lang=lang==="ca"?"fr":"ca";save("lang",lang);$("#lang").textContent=lang==="ca"?"FR":"CA";cur?render():home()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&cur&&st)persist()});
{const th=load("theme",null);if(th)document.documentElement.dataset.theme=th}
$("#lang").textContent=lang==="ca"?"FR":"CA";
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
try{home()}catch(e){document.body.insertAdjacentHTML('afterbegin','<pre style=\"padding:12px;white-space:pre-wrap\">Error: '+e.message+'</pre>')}
</script>
